name: publish

# Publishes a tagged release to npm via OIDC trusted publishing (no long-lived token).
# release-please only creates the tag + GitHub release; this workflow is the single publisher.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to publish (e.g. v0.3.0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm trusted publishing
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git describe needs the tags
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: '24' # npm 11.x, trusted publishing needs >= 11.5.1
          # No `registry-url` on purpose: with it, setup-node v4 writes
          # `_authToken=${NODE_AUTH_TOKEN}` into .npmrc and exports
          # NODE_AUTH_TOKEN=XXXXX-XXXXX-XXXXX-XXXXX (authutil.ts), so npm sends a
          # bogus token and never performs the OIDC exchange (fails with 404).

      - name: Check out requested tag
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: git checkout --force "${{ inputs.tag }}"

      - name: Install
        run: bun install --frozen-lockfile

      - name: Verify
        run: |
          bun run typecheck
          bun test
          bun run build
          bun run check:imports

      - name: Check the checked-out commit is exactly the release tag
        id: tag
        run: |
          tag="$(git describe --tags --exact-match HEAD 2>/dev/null || true)"
          version="$(node -p "require('./package.json').version")"
          if [ -z "$tag" ]; then
            echo "::error::HEAD ($(git rev-parse --short HEAD)) is not tagged; refusing to publish"
            exit 1
          fi
          echo "HEAD is tag $tag; package.json version is $version"
          if [ "${tag#v}" != "$version" ]; then
            echo "::error::tag $tag does not match package.json version $version"
            exit 1
          fi
          {
            echo "tag=$tag"
            echo "commit=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: Rewrite README image paths for the tag
        run: node scripts/prepublish-readme.mjs "${{ steps.tag.outputs.tag }}"

      - name: Confirm the OIDC environment is available
        run: |
          npm --version
          if [ -z "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "::error::ACTIONS_ID_TOKEN_REQUEST_URL is empty; the job needs 'id-token: write'"
            exit 1
          fi
          echo "OIDC token endpoint is available"

      - name: Inspect tarball
        run: npm pack --dry-run

      - name: Publish to npm
        run: npm publish --access public --loglevel=verbose

      - name: Diagnose the trusted-publishing exchange (only after a failed publish)
        if: ${{ failure() }}
        run: |
          set +e
          id_token=$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" \
            | node -e 'const j=JSON.parse(require("fs").readFileSync(0,"utf8"));process.stdout.write(j.value||"")')
          echo "id token length: ${#id_token}"
          [ -z "$id_token" ] && exit 0
          # Same call npm/cli makes in lib/utils/oidc.js; the body carries the
          # registry's reason (npm itself only logs it at --loglevel=verbose).
          for name in "@expnn%2Fopencode-insight" "%40expnn%2Fopencode-insight"; do
            echo "--- exchange for $name ---"
            curl -sS -X POST \
              -H "Authorization: Bearer $id_token" \
              -w '\nhttp_status=%{http_code}\n' \
              "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/$name" \
              | head -c 1200
            echo
          done
