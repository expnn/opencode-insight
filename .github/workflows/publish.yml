name: publish

# Publishes a release tag to npm via OIDC trusted publishing (no long-lived token).
# Only a tag ref may publish: the SLSA provenance npm attaches records the ref and
# commit that *triggered* the run, so building from a branch and checking the tag
# out afterwards would attest the branch commit instead of the released one.
# For a manual publish, dispatch this workflow against the tag itself:
#   gh workflow run publish.yml --ref v0.3.1

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm trusted publishing
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git describe needs the tags
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: '24' # npm 11.x, trusted publishing needs >= 11.5.1
          # No `registry-url` on purpose: with it, setup-node v4 writes
          # `_authToken=${NODE_AUTH_TOKEN}` into .npmrc and exports
          # NODE_AUTH_TOKEN=XXXXX-XXXXX-XXXXX-XXXXX (authutil.ts), so npm sends a
          # bogus token and never performs the OIDC exchange (fails with 404).

      - name: Verify the ref is the release tag
        id: tag
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) ;;
            *)
              echo "::error::publishing runs must be dispatched against a release tag (refs/tags/v*), got $GITHUB_REF"
              echo "::error::hint: gh workflow run publish.yml --ref vX.Y.Z"
              exit 1
              ;;
          esac
          tag="${GITHUB_REF#refs/tags/}"
          version="$(node -p "require('./package.json').version")"
          head_tag="$(git describe --tags --exact-match HEAD 2>/dev/null || true)"
          if [ "$head_tag" != "$tag" ]; then
            echo "::error::HEAD ($(git rev-parse --short HEAD)) is not exactly tag $tag (got '${head_tag:-none}')"
            exit 1
          fi
          if [ "${tag#v}" != "$version" ]; then
            echo "::error::tag $tag does not match package.json version $version"
            exit 1
          fi
          echo "publishing $tag at commit $(git rev-parse HEAD)"
          {
            echo "tag=$tag"
            echo "commit=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: Install
        run: bun install --frozen-lockfile

      - name: Verify
        run: |
          bun run typecheck
          bun test
          bun run build
          bun run check:imports

      - name: Rewrite README image paths for the tag
        run: node scripts/prepublish-readme.mjs "${{ steps.tag.outputs.tag }}"

      - name: Confirm the OIDC environment is available
        run: |
          npm --version
          if [ -z "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "::error::ACTIONS_ID_TOKEN_REQUEST_URL is empty; the job needs 'id-token: write'"
            exit 1
          fi
          echo "OIDC token endpoint is available"

      - name: Inspect tarball
        run: npm pack --dry-run

      - name: Publish to npm
        run: npm publish --access public --loglevel=verbose

      - name: Diagnose the trusted-publishing exchange (only after a failed publish)
        if: ${{ failure() }}
        run: |
          set +e
          id_token=$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" \
            | node -e 'const j=JSON.parse(require("fs").readFileSync(0,"utf8"));process.stdout.write(j.value||"")')
          echo "id token length: ${#id_token}"
          [ -z "$id_token" ] && exit 0
          # Same call npm/cli makes in lib/utils/oidc.js; the body carries the
          # registry's reason (npm itself only logs it at --loglevel=verbose).
          curl -sS -X POST \
            -H "Authorization: Bearer $id_token" \
            -w '\nhttp_status=%{http_code}\n' \
            "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/@expnn%2Fopencode-insight" \
            | head -c 1200
