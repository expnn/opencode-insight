name: release-please

# Manual only. Publishing is handled by .github/workflows/publish.yml on release
# tags, and versions/CHANGELOG are maintained by hand, so this workflow has no
# manifest to anchor on: on a push to main it computed a *downgrade* (0.3.1 ->
# 0.2.0) and failed anyway, because the repository does not allow GitHub Actions
# to create pull requests. Keep it for an opt-in run, not on every push.
on:
  workflow_dispatch:

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release-type: node
